# IRThermal configuration. Full reference: docs/configuration.md

[server]
host = "0.0.0.0"
port = 8000
log_level = "info"
log_format = "json"

# SD card rack: fixed device, raw sensor data, labelled points
[[cameras]]
id = "pi-rack"
device = "/dev/video0"
transport = "auto"
raw_mode = true
calibration_file = "./.temp/calibration/pi-rack.npz"
temperature_offset = 8.5
emissivity = 0.95
colormap = "inferno"

[[cameras.points]]
name = "hiend-1"
x = 43
y = 125
labels = { group = "hiend", slot = "1" }

[[cameras.points]]
name = "hiend-2"
x = 40
y = 111
labels = { group = "hiend", slot = "2" }

[[cameras.points]]
name = "ind-1"
x = 132
y = 120
labels = { group = "ind", slot = "1" }

[[cameras.points]]
name = "ultra-1"
x = 207
y = 123
labels = { group = "ultra", slot = "1" }

# Bench camera, auto-detected
[[cameras]]
id = "bench"
auto_detect = true
colormap = "jet"

